<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>k8s-tray-forwarder — Docs</title>
    <meta name="description" content="User guide for k8s-tray-forwarder, a macOS menu-bar app for Kubernetes port-forwards." />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #5b6ef5; /* matches the app's accent */
      }
      /* Screenshots are ~700px app windows captured at 2x. Each <img> carries
         its own width= so it reads as a figure rather than filling the column;
         max-width keeps it responsive on narrow screens. */
      .markdown-section img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 1.2em 0;
        border: 1px solid #e1e4f0;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(20, 22, 40, 0.08);
      }
    </style>
  </head>
  <body>
    <div id="app">Loading the docs…</div>
    <script>
      window.$docsify = {
        name: 'k8s-tray-forwarder',
        repo: 'https://github.com/dawidlaszuk/k8s-tray-forwarder',
        homepage: 'README.md',
        loadSidebar: false,
        relativePath: true, // so images/… links resolve next to README.md
        auto2top: true,
        maxLevel: 3,
        subMaxLevel: 3, // build an in-page table of contents from headings
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
