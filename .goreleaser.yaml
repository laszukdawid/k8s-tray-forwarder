# GoReleaser config for k8s-tray-forwarder.
# Documentation: https://goreleaser.com
#
# Builds the macOS binaries (per-arch + a merged universal binary) and publishes
# a GitHub Release on a version tag. Fyne is a CGO app, so this must run on a
# macOS runner (no Linux cross-compile); the amd64 slice is cross-built from the
# arm64 runner via `clang -arch x86_64`.
#
# The universal binary is wrapped into "K8s Port Forwards.app" and the Homebrew
# cask is published OUTSIDE GoReleaser (see .github/workflows/release.yml +
# packaging/). GoReleaser OSS can only emit a `binary` cask stanza / can't build
# .app bundles — both are Pro features — and we need an `app` stanza so `brew
# install` drops a launchable app, not a CLI binary.
version: 2

project_name: k8s-tray-forwarder

before:
  hooks:
    # download only — don't mutate go.mod/go.sum during the release job
    - go mod download

builds:
  - id: k8s-tray-forwarder
    main: .
    binary: k8s-tray-forwarder
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    # Cross-build the amd64 slice from the arm64 runner. The macOS SDK is
    # universal, so clang can target x86_64. If this ever proves flaky, drop
    # amd64 from goarch above — arm64-only still covers every Apple Silicon Mac.
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - 'CC=clang -arch x86_64'
          - 'CXX=clang++ -arch x86_64'
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

# Merge the arm64 + amd64 binaries into one universal (fat) binary. The release
# workflow wraps this into the .app so a single bundle runs on Apple Silicon and
# Intel alike. replace: false keeps the per-arch tarballs below for CLI users.
universal_binaries:
  - id: universal
    ids:
      - k8s-tray-forwarder
    replace: false
    name_template: k8s-tray-forwarder

archives:
  - id: k8s-tray-forwarder
    ids:
      - k8s-tray-forwarder
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: laszukdawid
    name: k8s-tray-forwarder
  draft: false
  prerelease: auto
  mode: replace
  name_template: "{{ .ProjectName }} v{{ .Version }}"

# The "K8s Port Forwards.app" zip and the Homebrew cask are produced after this
# run by the release workflow (packaging/make-app.sh + packaging/publish-cask.sh)
# — see the header comment for why the cask can't be generated here.
