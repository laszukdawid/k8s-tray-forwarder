version: '3'

vars:
  APP_NAME: K8s Port Forwards
  BIN: k8s-tray-forwarder
  TAP: laszukdawid/tap

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile the binary
    cmds:
      - go build -o {{.BIN}} .

  run:
    desc: Build and run directly (useful while developing)
    cmds:
      - go run .

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Format, vet and test
    deps: [fmt, vet, test]

  bundle:
    desc: 'Build "{{.APP_NAME}}.app" (+ distributable zip) into the project root'
    cmds:
      - ./packaging/make-app.sh --out .

  gen-icon:
    desc: 'Regenerate the placeholder app icon (packaging/icon.png)'
    cmds:
      - go run ./packaging/gen-icon -o packaging/icon.png

  cask:
    desc: 'Render the Homebrew cask locally (dry run) from the built app zip'
    deps: [bundle]
    cmds:
      - 'ZIP=$(ls K8s-Port-Forwards_*.zip | head -1); ./packaging/publish-cask.sh --version "$(basename "$ZIP" .zip | sed "s/^K8s-Port-Forwards_//")" --zip "$ZIP" --dry-run'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN}} "{{.APP_NAME}}.app" K8s-Port-Forwards_*.zip dist

  release-check:
    desc: Validate the GoReleaser config
    cmds:
      - goreleaser check

  release-snapshot:
    desc: 'Build a local release into ./dist without publishing (validates the build, incl. CGO)'
    cmds:
      - goreleaser release --snapshot --clean

  brew-install:
    desc: 'Install the prebuilt binary from the tap'
    cmds:
      - 'brew install --cask {{.TAP}}/{{.BIN}}'
