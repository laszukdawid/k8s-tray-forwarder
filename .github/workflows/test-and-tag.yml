# On every push to main, run the tests and — if they pass — bump the version
# and push a new SemVer tag. That tag push triggers release.yml, which runs
# GoReleaser to build the binaries and update the Homebrew tap.
#
# The bump type is derived from the conventional-commit messages since the last
# tag (feat!:/BREAKING CHANGE: -> major, feat: -> minor, anything else -> patch),
# or chosen explicitly when run manually via workflow_dispatch.
#
# Required secret (add to this repo's Actions secrets):
#   GH_PAT — a PAT with `contents: write` (repo) scope. The tag MUST be pushed
#            with this PAT rather than the default GITHUB_TOKEN; tags pushed with
#            GITHUB_TOKEN do not trigger other workflows, so release.yml would
#            never fire.
name: Test and Tag

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # macOS runner: this is a CGO/Fyne app and the tests build against the
    # macOS frameworks, same as the release job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so `git describe --tags` sees tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  tag-release:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for tags
          token: ${{ secrets.GH_PAT }} # PAT so the tag push triggers release.yml

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Latest tag, or v0.0.0 if the repo has none yet.
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Determine version bump type
        id: determine_bump
        run: |
          BUMP_TYPE="patch"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual run: honour the chosen bump type.
            BUMP_TYPE="${{ github.event.inputs.version_bump }}"
          else
            # Auto: inspect conventional-commit subjects since the last tag.
            LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

            if echo "$COMMITS" | grep -qE "^(feat|fix|chore|docs|style|refactor|perf|test)(\(.+\))?!:|BREAKING CHANGE:"; then
              BUMP_TYPE="major"
            elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi

          echo "Version bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: calculate_version
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ steps.determine_bump.outputs.bump_type }}"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case $BUMP_TYPE in
            major) NEW_VERSION="v$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "New version: $NEW_VERSION (bump type: $BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          NEW_VERSION="${{ steps.calculate_version.outputs.new_version }}"

          # Skip if the tag already exists on the remote (manual push / re-run).
          if git ls-remote --tags origin "refs/tags/$NEW_VERSION" | grep -q "refs/tags/$NEW_VERSION"; then
            echo "Tag $NEW_VERSION already exists on remote, skipping."
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION - Automated ${{ steps.determine_bump.outputs.bump_type }} version bump"
          git push origin "$NEW_VERSION"
